# Keeps the free Render server for the Aayu'z Cafe app awake
# (free instances sleep after 15 idle minutes).
name: Keep server awake

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub may delay runs; 5 minutes leaves headroom under 15
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://aayuz-cafe-api.onrender.com/api/healthz
